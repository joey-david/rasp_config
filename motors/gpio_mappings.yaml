motor_driver: TB6612FNG

left_motor: a_motor
right_motor: b_motor

a_motor:
  pwm: 6 #pin 31
  in1: 16 #pin 36
  in2: 13 #pin 33

b_motor:
  pwm: 4 #pin 7 (was 21, pin 40 - dead)
  in1: 17 #pin 11 (was 20, pin 38 - dead)
  in2: 5 #pin 29 (was 26, pin 37 - dead)

driver:
  standby: 19 #pin 35

power:
  logic_vcc: "Pi 3.3V"
  motor_vm: "USB-C breakout VBUS"
  ground: "shared Pi GND + motor supply GND"
